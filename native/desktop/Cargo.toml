[package]
name = "rg-native"
description = "Reset Generation on the recompiled engine: a native desktop game (Windows, Linux, macOS)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[[bin]]
name = "ResetGeneration"
path = "src/main.rs"

[dependencies]
# X11 only (also runs under XWayland): loaded at run time, nothing to install for the build
minifb = { version = "0.29", default-features = false, features = ["x11"] }
tinyaudio = "2"
# the relay for LAN games, run in-process by a hosting game (server=auto without internet, or lan)
rg-server = { path = "../../server" }
tokio = { version = "1", features = ["rt", "net"] }

[target.'cfg(windows)'.dependencies]
# borderless fullscreen (F11, Alt+Enter), the window icon
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_LibraryLoader", "Win32_UI_WindowsAndMessaging"] }
