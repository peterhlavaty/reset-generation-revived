[package]
name = "rg-native"
description = "Reset Generation on the recompiled engine: a native desktop game (Windows, Linux, macOS)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[[bin]]
name = "ResetGeneration"
path = "src/main.rs"

[dependencies]
# X11 only (also runs under XWayland): loaded at run time, nothing to install for the build
minifb = { version = "0.29", default-features = false, features = ["x11"] }
tinyaudio = "2"
