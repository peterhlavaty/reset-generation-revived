[workspace]
resolver = "2"
members = ["server", "tools/rgtool", "tools/lan-setup", "native/desktop"]
# native/desktop links the recompiled engine, which `cargo x build-desktop` builds first
default-members = ["server", "tools/rgtool", "tools/lan-setup"]

[workspace.package]
version = "2.0.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/peterhlavaty/reset-generation-revived"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true

# The relay runs on a small VPS and in every hosting player's game: small and lean.
[profile.release.package.rg-server]
opt-level = "s"
codegen-units = 1
