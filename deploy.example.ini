# rgtool deploy settings: copy to deploy.local.ini (git-ignored) and fill in.
# The server must already run nginx (any setup; deploy only adds its own site for `domain`).
host = 203.0.113.10
# root, or a user that may write /opt, /etc/systemd/system and /etc/nginx without a password
user = root
# OpenSSH private key; key_pass_file holds its passphrase (omit for a key without one)
key = ~/.ssh/id_ed25519
key_pass_file = ~/.ssh/keypass.txt
# the relay's own (sub)domain; DNS must already point at host
domain = relay.example.com
