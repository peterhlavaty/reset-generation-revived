# Reset Generation Revived settings. Delete this file to restore defaults.
#
# render_height / render_width: the resolution the game engine draws at.
#   auto = pick the size that integer-scales to your monitor
#          (640x360 on any 16:9 screen: x2 at 720p, x3 at 1080p, x4 at 1440p).
#   Lower values make everything bigger; e.g. render_height=270 for 480x270.
render_height=auto
render_width=auto
#
# window_scale: windowed-mode size as a multiple of the render size (0 = auto).
window_scale=0
#
# fullscreen: start in borderless fullscreen (toggle any time with F11 or Alt+Enter).
fullscreen=false
#
# filter: nearest (crisp pixels) or smooth (bilinear, only used when the
#   window is not an exact multiple of the render size).
filter=nearest
#
# Online play (Quick Match / Online menu) goes through a relay server.
# server: auto = LAN play with nothing to set up: the hosting player's game runs the relay
#   itself (TCP + UDP port 8787; allow it when Windows asks) and the others' games find it on
#   the network. Or the WebSocket address of a relay you run yourself, e.g.
#   ws://192.168.1.20:8787/ws (server/ with `npm start`) or wss://<your-worker>.workers.dev/ws.
# nickname: your name online (letters, digits, _; max 15). Generated on first launch if empty.
server=auto
nickname=
#
# Hosting a game: press F5 in the main menu, choose the number of players and your hero
#   (Esc = cancel). Your game becomes the match's server and you play in it; the other players
#   pick Quick Match (and a hero) and are put into your game.
# host_players: players in a hosted game including you (2-4); remembers the last F5 choice.
host_players=2
# host_hero: empty = choose after F5; RANDOM or a hero (HEDGEHOG, PLUMBER, CYBORG, LEVEL_50_ELF,
#   BABE_GUNNER, MONSTER_TRAINER, SCIFI_KNIGHT, NINJA, DR_LOVEBOMBER, AGGRESSOR) skips the choice.
host_hero=
